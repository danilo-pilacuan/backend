[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes (base); I: isort; B: bugbear; UP: pyupgrade.
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# Depends() en defaults es el patron idiomatico de FastAPI (inmutables).
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
